server:
  port: ${SERVER_PORT}
spring:
  datasource:
    driver-class-name : com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${USERNAME}
    password : ${PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

# JWT 설정
jwt:
  secretKey: ${JWT_SECRET_KEY}
  expiration-time: ${JWT_EXP}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  api-url: ${KAKAO_API_URL}

